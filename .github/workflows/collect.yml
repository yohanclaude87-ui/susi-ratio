      - name: 결과 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data model.json
          git commit -m "수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" || echo "변경 없음"
          for i in 1 2 3; do
            git push && break
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git reset --hard origin/main; break; }
          done
